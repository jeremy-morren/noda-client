version: 2
# One pull request per dependency bump (no groups), so each can be reviewed, tested and merged on its own.
updates:
  - package-ecosystem: npm
    directory: /ts
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  # noda_dart and the Flutter test app (pub).
  - package-ecosystem: pub
    directories: [/dart/noda_dart, /dart/test_apps/system_source_checks, /dart/test_apps/system_source_flutter]
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /tools
    schedule:
      interval: weekly
  # The .NET SDK in tools/global.json (and so the runtime the tools run on: see tools/Directory.Build.props). Patch
  # releases only: a new major or minor .NET also needs the tools' TargetFramework changed, by hand.
  - package-ecosystem: dotnet-sdk
    directory: /tools
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
