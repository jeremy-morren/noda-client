name: release npm

# When a release is published (or by hand, for a published release's tag): stages its npm tarballs on npm (live once a
# maintainer approves them), publishes them to GitHub Packages, and opens a pull request with the released changelogs.
# npm trusted publishing (stage-only) per package: repository jeremy-morren/noda-client, workflow release-npm.yml,
# environment npm.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: A published release's tag (v3.3.1)
        required: true

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      # No registry-url: it would set NODE_AUTH_TOKEN, which overrides OIDC.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Staged publishing needs npm 11.15.0 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: node ts/scripts/release/stage-npm.ts --tag "$TAG"

  # The same tarballs on GitHub Packages, renamed @<owner>/<name>. Separate, so it can be re-run alone.
  github-packages:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - run: node ts/scripts/release/publish-github-packages.ts --tag "$TAG" --owner "$GITHUB_REPOSITORY_OWNER"
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

  # The changelogs as released, as a pull request to main (branch changelog-update-<tag>; changelog-only, so no CI).
  changelog:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - id: version
        run: node scripts/release/version-from-tag.ts --tag "$TAG"
      - run: node scripts/changelog/changelog.ts release '${{ steps.version.outputs.version }}'
      - run: node scripts/release/changelog-pull-request.ts --tag "$TAG"
