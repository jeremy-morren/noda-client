name: release dart

# Publishes the release's noda_dart archive to pub.dev when its tag is pushed (pub.dev's automated publishing only
# accepts tag pushes; publishing a release pushes its tag).

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  id-token: write # pub.dev's OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: node dart/scripts/package/publish.ts --tag "$GITHUB_REF_NAME"
