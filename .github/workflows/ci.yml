name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Everything a job downloads is cached. Every job skips release.yml's changelog pull requests (changelog-update-*).
jobs:
  checks:
    if: ${{ !contains(github.head_ref, 'changelog-update') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: tools/global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            ts/package-lock.json
            package-lock.json
      - run: npm ci && npm ci --prefix "$GITHUB_WORKSPACE"
      - run: npm audit signatures
      - run: npm run typecheck
      - name: Changelogs
        run: node "$GITHUB_WORKSPACE/scripts/changelog/changelog.ts" check
      - run: npm run build
      - run: npm run check:package
      - run: npm run check:reproducible
      - run: npm run build:module

  test:
    if: ${{ !contains(github.head_ref, 'changelog-update') }}
    name: test (${{ matrix.os }}, ${{ matrix.project }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout || 60 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        project: [node, node-longjs, chromium, firefox, webkit]
        include:
          - { os: windows-latest, project: edge }
          - { os: windows-11-arm, project: node }
          - { os: macos-latest, project: safari }
          - { os: macos-latest, project: ios-safari, timeout: 120 }
    defaults:
      run:
        shell: bash
        working-directory: ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        if: runner.os == 'Windows'
        with:
          global-json-file: tools/global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            ts/package-lock.json
            package-lock.json
      - run: npm ci && npm ci --prefix "$GITHUB_WORKSPACE"

      - name: Playwright version
        id: playwright
        if: contains(fromJSON('["chromium", "firefox", "webkit"]'), matrix.project)
        run: node "$GITHUB_WORKSPACE/ts/scripts/test/playwright-version.ts"
      - uses: actions/cache@v6
        if: steps.playwright.outputs.version
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ steps.playwright.outputs.version }}
      - name: Install ${{ matrix.project }}
        if: steps.playwright.outputs.version
        run: npx playwright install --with-deps ${{ matrix.project }}

      # Hermes and engines without BigInt (Node.js 8, QuickJS, Chromium 66), for test/module/.
      - uses: actions/cache@v6
        if: startsWith(matrix.project, 'node')
        with:
          path: |
            ts/node_modules/.cache/hermes
            ts/node_modules/.cache/old-engines
          key: engines-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ts/scripts/test/install-hermes.*', 'ts/scripts/test/install-old-engines.*') }}
      - if: startsWith(matrix.project, 'node')
        run: npm run test:install-hermes
      - if: startsWith(matrix.project, 'node')
        run: npm run test:install-old-engines
      # For test/bundlers/. Pinned, so setup-bun caches it.
      - uses: oven-sh/setup-bun@v2
        if: startsWith(matrix.project, 'node') && !(runner.os == 'Windows' && runner.arch == 'ARM64')
        with:
          bun-version: 1.4.4
      - if: matrix.project == 'safari' || matrix.project == 'ios-safari'
        run: sudo safaridriver --enable
      - if: matrix.project == 'ios-safari'
        run: npm run test:start-ios-simulator
      # For the Windows system time zone tests.
      - if: runner.os == 'Windows'
        run: npm run test:export-system-zones
      - if: runner.os == 'Windows' && startsWith(matrix.project, 'node')
        run: npm run build:native
      - name: Native C tests
        if: runner.os == 'Windows' && matrix.project == 'node'
        run: npm run test:native -- --coverage

      - name: Test
        run: npm run test:blob -- --project ${{ matrix.project }} ${{ matrix.project == 'node' && '--coverage' || '' }}
      - name: Simulator state
        if: failure() && matrix.project == 'ios-safari'
        run: node "$GITHUB_WORKSPACE/scripts/devices/save-simulator-state.ts" --out ts/test-results/ios
      - uses: actions/upload-artifact@v7
        if: failure() && matrix.project == 'ios-safari'
        with:
          name: ios-diagnostics
          path: ts/test-results/ios/
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-${{ matrix.project }}-${{ runner.os }}-${{ runner.arch }}
          path: ts/test-results/blob/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && runner.os == 'Windows' && matrix.project == 'node' }}
        with:
          name: coverage-native-${{ runner.arch }}
          path: ts/test-results/native-coverage.lcov
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.project == 'node' }}
        with:
          name: coverage-node-${{ runner.os }}-${{ runner.arch }}
          path: ts/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Chrome on an Android emulator, through Appium.
  android:
    if: ${{ !contains(github.head_ref, 'changelog-update') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
    defaults:
      run:
        shell: bash
        working-directory: ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            ts/package-lock.json
            package-lock.json
      - run: npm ci && npm ci --prefix "$GITHUB_WORKSPACE"
      - run: node "$GITHUB_WORKSPACE/scripts/devices/enable-kvm.ts"
      - run: npm install --global appium@3.8.0 && appium driver install uiautomator2@8.7.0
      # The system image and a booted snapshot: later runs start the emulator warm.
      - uses: actions/cache@v6
        id: avd
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: avd-35-google_apis-x86_64-v1
      - name: Create the emulator snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Snapshot created."
      - name: Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          working-directory: ts
          script: npm run test:android -- --stop-emulator
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-android-chrome
          path: ts/test-results/blob/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: appium-log
          path: ts/test-results/appium*.log
          overwrite: true

  dart-checks:
    if: ${{ !contains(github.head_ref, 'changelog-update') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: dart/noda_dart
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-checks-${{ hashFiles('dart/**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-${{ runner.arch }}-checks-
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: tools/global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefix "$GITHUB_WORKSPACE"
      - run: dart pub get
      - run: dart analyze --fatal-warnings
      # pub skips gitignored files, so the package keeps copies.
      - name: Licence copies match the repository's
        run: cmp "$GITHUB_WORKSPACE/LICENSE.txt" LICENSE && cmp "$GITHUB_WORKSPACE/NOTICE.txt" NOTICE.txt
      - run: node "$GITHUB_WORKSPACE/dart/scripts/package/pack.ts"
      - run: node "$GITHUB_WORKSPACE/dart/scripts/package/validate-package.ts"
      - run: node "$GITHUB_WORKSPACE/dart/scripts/package/pana.ts"

  # Full suite with coverage, then the system tests in each of dart/scripts/test/time-zones.json's zones.
  dart-vm:
    if: ${{ !contains(github.head_ref, 'changelog-update') }}
    name: dart vm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, zones: true }
          - { os: windows-latest, zones: true }
          - { os: windows-11-arm }
          - { os: macos-latest, zones: true }
    defaults:
      run:
        shell: bash
        working-directory: dart/noda_dart
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ~/AppData/Local/Pub/Cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dart/**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefix "$GITHUB_WORKSPACE"
      - run: dart pub get
      - name: Test
        run: node "$GITHUB_WORKSPACE/dart/scripts/test/test.ts" --platform vm --coverage
      - name: System time zones
        if: ${{ !cancelled() && matrix.zones }}
        run: node "$GITHUB_WORKSPACE/dart/scripts/test/test-time-zones.ts"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: dart-results-vm-${{ runner.os }}-${{ runner.arch }}
          path: dart/noda_dart/test-results/*.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: dart-coverage-vm-${{ runner.os }}-${{ runner.arch }}
          path: dart/noda_dart/coverage/*.lcov.info
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Coverage only from Chrome with dart2js (the only web leg package:test reports it for).
  dart-web:
    if: ${{ !contains(github.head_ref, 'changelog-update') }}
    name: dart web (${{ matrix.platform }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: chrome, compiler: dart2js, coverage: true }
          - { os: ubuntu-latest, platform: chrome, compiler: dart2wasm }
          # One suite at a time: suites share the page's main thread (see dart_test.yaml).
          - { os: ubuntu-latest, platform: firefox, compiler: dart2js, args: --concurrency=1 }
          - { os: ubuntu-latest, platform: firefox, compiler: dart2wasm, args: --concurrency=1 }
          - { os: windows-latest, platform: edge, compiler: dart2js }
          - { os: macos-latest, platform: safari, compiler: dart2js }
          - { os: ubuntu-latest, platform: node, compiler: dart2js }
          - { os: ubuntu-latest, platform: node, compiler: dart2wasm }
    env:
      TZ: Europe/Berlin
      MOZ_HEADLESS: '1'
    defaults:
      run:
        shell: bash
        working-directory: dart/noda_dart
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ~/AppData/Local/Pub/Cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dart/**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-${{ runner.arch }}-
      # Also dart2wasm on Node.js, which needs WasmGC.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefix "$GITHUB_WORKSPACE"
      - if: matrix.platform == 'safari'
        run: sudo safaridriver --enable
      - run: dart pub get
      - name: Test
        run: >
          node "$GITHUB_WORKSPACE/dart/scripts/test/test.ts" --platform ${{ matrix.platform }} --compiler ${{ matrix.compiler }}
          ${{ matrix.coverage && '--coverage' || '' }} ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: dart-results-${{ matrix.platform }}-${{ matrix.compiler }}
          path: dart/noda_dart/test-results/*.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.coverage }}
        with:
          name: dart-coverage-${{ matrix.platform }}-${{ matrix.compiler }}
          path: dart/noda_dart/coverage/*.lcov.info
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # The system time zone checks in a Flutter desktop app: the zone set on the machine, and the zone TZ names
  # (dart/scripts/flutter/desktop.ts decides the rest).
  flutter-desktop:
    if: ${{ !contains(github.head_ref, 'changelog-update') }}
    name: flutter (${{ matrix.device }}, ${{ matrix.source }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, device: windows, source: system, zone: AUS Eastern Standard Time, expected: AUS Eastern Standard Time }
          - { os: windows-latest, device: windows, source: TZ, zone: Asia/Kolkata, expected: India Standard Time }
          - { os: ubuntu-latest, device: linux, source: system, zone: Australia/Sydney, expected: Australia/Sydney }
          - { os: ubuntu-latest, device: linux, source: TZ, zone: Asia/Kolkata, expected: Asia/Kolkata }
          - { os: macos-latest, device: macos, source: system, zone: Australia/Sydney, expected: Australia/Sydney }
          - { os: macos-latest, device: macos, source: TZ, zone: Asia/Kolkata, expected: Asia/Kolkata }
    defaults:
      run:
        shell: bash
        working-directory: dart/test_apps/system_source_flutter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefix "$GITHUB_WORKSPACE"
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev xvfb > /dev/null
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: System time zone checks
        run: >
          node "$GITHUB_WORKSPACE/dart/scripts/flutter/desktop.ts" --device ${{ matrix.device }} --source ${{ matrix.source }}
          --zone "${{ matrix.zone }}" --expected "${{ matrix.expected }}"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: dart-results-flutter-${{ matrix.device }}-${{ matrix.source }}
          path: dart/test_apps/system_source_flutter/test-results/*.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: dart-coverage-flutter-${{ matrix.device }}-${{ matrix.source }}
          path: dart/test_apps/system_source_flutter/coverage-out/*.lcov.info
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Release mode: it's the code that ships. Safari ignores TZ.
  flutter-web:
    if: ${{ !contains(github.head_ref, 'changelog-update') }}
    name: flutter web (${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, browser: chrome }
          - { os: ubuntu-latest, browser: firefox }
          - { os: macos-latest, browser: safari }
    env:
      TZ: Europe/Berlin
    defaults:
      run:
        shell: bash
        working-directory: dart/test_apps/system_source_flutter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefix "$GITHUB_WORKSPACE"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - if: matrix.browser == 'safari'
        run: sudo safaridriver --enable
      - name: System time zone checks in ${{ matrix.browser }}
        run: node "$GITHUB_WORKSPACE/dart/scripts/flutter/web.ts" --browser ${{ matrix.browser }}

  # tzdata in the time zone APEX (API 35), and in /system/usr/share/zoneinfo before it (API 28).
  flutter-android:
    if: ${{ !contains(github.head_ref, 'changelog-update') }}
    name: flutter (Android API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api-level: 35, target: google_apis }
          - { api-level: 28, target: default }
    env:
      TIME_ZONE: America/New_York
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone America/New_York
    defaults:
      run:
        shell: bash
        working-directory: dart/test_apps/system_source_flutter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefix "$GITHUB_WORKSPACE"
      - run: node "$GITHUB_WORKSPACE/scripts/devices/enable-kvm.ts"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            dart/test_apps/system_source_flutter/android/*.gradle*
            dart/test_apps/system_source_flutter/android/app/*.gradle*
            dart/test_apps/system_source_flutter/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Fails before the emulator starts if the Gradle setup is broken.
      - run: flutter build apk --debug
      # The system image and a booted snapshot: later runs start the emulator warm.
      - uses: actions/cache@v6
        id: avd
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-${{ matrix.api-level }}/${{ matrix.target }}/x86_64
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-x86_64-${{ env.TIME_ZONE }}-v1
      - name: Create the emulator snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Snapshot created."
      - name: System time zone checks on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          working-directory: dart/test_apps/system_source_flutter
          script: node "$GITHUB_WORKSPACE/dart/scripts/flutter/android.ts" --expected ${{ env.TIME_ZONE }} --stop-emulator
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: android-logcat-${{ matrix.api-level }}
          path: dart/test_apps/system_source_flutter/test-results/logcat.txt
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: dart-results-flutter-android-${{ matrix.api-level }}
          path: dart/test_apps/system_source_flutter/test-results/*.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # flutter/flutter#181771: flutter test can miss the VM service and hang; the script retries.
  flutter-ios:
    if: ${{ !contains(github.head_ref, 'changelog-update') }}
    name: flutter (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TIME_ZONE: Australia/Sydney
    defaults:
      run:
        shell: bash
        working-directory: dart/test_apps/system_source_flutter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefix "$GITHUB_WORKSPACE"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # The Simulator takes the Mac's zone when it boots; systemsetup fails on GitHub's runners.
      - name: Boot an iOS Simulator in the Mac's zone set to ${{ env.TIME_ZONE }}
        run: node "$GITHUB_WORKSPACE/scripts/devices/start-ios-simulator.ts" --no-safari --time-zone "$TIME_ZONE"
      - name: System time zone checks on the Simulator
        timeout-minutes: 35
        run: node "$GITHUB_WORKSPACE/dart/scripts/flutter/ios-simulator.ts" --expected "$TIME_ZONE"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: dart-results-flutter-ios
          path: dart/test_apps/system_source_flutter/test-results/*.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Both ports' results as one check and PR comment, with coverage. Fails if any test failed.
  report:
    needs: [test, android, dart-vm, dart-web, flutter-desktop, flutter-web, flutter-android, flutter-ios]
    if: ${{ !cancelled() && !contains(github.head_ref, 'changelog-update') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    defaults:
      run:
        shell: bash
        working-directory: ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            ts/package-lock.json
            package-lock.json
      - run: npm ci && npm ci --prefix "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          path: ts/test-results/blob
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-node-*
          path: ts/test-results/coverage
      - name: Merge
        run: npm run test:merge

      - uses: dart-lang/setup-dart@v1
      - uses: actions/download-artifact@v8
        with:
          pattern: dart-results-*
          path: dart/noda_dart/test-results/runs
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: dart-coverage-*
          path: dart/noda_dart/coverage/runs
          merge-multiple: true
      - name: Merge (noda_dart)
        if: ${{ !cancelled() }}
        working-directory: dart/noda_dart
        run: dart run tool/test_report.dart test-results/runs test-results/junit.xml
      - name: Merge coverage (noda_dart)
        if: ${{ !cancelled() }}
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          toolpath: ${{ runner.temp }}/reportgeneratortool
          reports: dart/noda_dart/coverage/runs/*.lcov.info
          sourcedirs: dart/noda_dart
          targetdir: dart/noda_dart/coverage/report
          reporttypes: HtmlInline;MarkdownSummaryGithub
          title: noda_dart coverage (all platforms)

      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            ts/test-results/junit.xml
            dart/noda_dart/test-results/junit.xml
          check_name: Test results
          comment_title: Test results
          report_individual_runs: false
          json_suite_details: false
          large_files: true
      - name: Publish coverage
        if: ${{ !cancelled() }}
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ts
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: changes
      - name: noda_dart coverage summary
        if: ${{ !cancelled() }}
        run: node "$GITHUB_WORKSPACE/scripts/ci/step-summary.ts" dart/noda_dart/coverage/report/SummaryGithub.md
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: dart-coverage-report
          path: dart/noda_dart/coverage/report/
      - name: noda_dart coverage comment
        if: >-
          ${{ !cancelled()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: noda-dart-coverage
          path: dart/noda_dart/coverage/report/SummaryGithub.md
