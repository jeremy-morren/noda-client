# Weekly: NodaTime main's latest commit, IANA tzdata and CLDR, regenerated into a pull request (whose CI checks it).
name: export

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: tools/global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefix "$GITHUB_WORKSPACE"
      - run: node "$GITHUB_WORKSPACE/tools/update-nodatime.ts"
      # Unlocked restore: a new NodaTime commit may change the tools' packages.lock.json.
      - run: node "$GITHUB_WORKSPACE/tools/generate.ts"
        env:
          CI: false
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: automated/export
          title: "Regenerate from NodaTime main / IANA / CLDR"
          commit-message: "Regenerate from NodaTime main / IANA / CLDR"
          body: Automated `node tools/update-nodatime.ts` and `node tools/generate.ts`.
