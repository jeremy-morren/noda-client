name: draft release

# On push to main: builds both ports' packages with the next version (version.txt's major.minor, one more than the
# highest published patch) and attaches them to a draft release, replacing an earlier draft of that version.
# Publishing the draft runs release.yml (npm) and, through the tag, publish-dart.yml (pub.dev).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create and delete releases and tags

concurrency:
  group: draft-release
  cancel-in-progress: true

# No caches in this workflow: it builds release assets (cache poisoning).
jobs:
  version:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci --prefix "$GITHUB_WORKSPACE"
      - id: version
        run: node "$GITHUB_WORKSPACE/scripts/release/next-version.ts"
      - run: node "$GITHUB_WORKSPACE/scripts/release/check-head-tag.ts" --version '${{ steps.version.outputs.version }}'

  # The Windows native addon packages, each built on its own architecture.
  native:
    needs: version
    name: native (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { runner: windows-latest, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci && npm ci --prefix "$GITHUB_WORKSPACE"
      - run: npm run build:native
      - run: node "$GITHUB_WORKSPACE/ts/scripts/release/pack.ts" --version '${{ needs.version.outputs.version }}' ts/src/noda-js-win32-${{ matrix.arch }}
      # Its debug symbols, matching the .node (reproducible too).
      - run: cp native/windows/build/Release/time-zones.pdb artifacts/time-zones-win32-${{ matrix.arch }}.pdb
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.arch }}
          path: |
            ts/artifacts/noda-js-win32-*.tgz
            ts/artifacts/time-zones-win32-*.pdb
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: [version, native]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ts
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: tools/global.json
      - uses: dart-lang/setup-dart@v1
      - run: npm ci && npm ci --prefix "$GITHUB_WORKSPACE"

      # Read before packing, which releases the Unreleased sections in its staged copies.
      - name: Release notes
        run: node "$GITHUB_WORKSPACE/scripts/changelog/changelog.ts" notes > "$RUNNER_TEMP/notes.md"
      - run: npm run build
      - run: npm run check:package
      - run: npm run build:module -- --version "$VERSION"
      - run: node "$GITHUB_WORKSPACE/ts/scripts/release/pack.ts" --version "$VERSION"
      - run: node "$GITHUB_WORKSPACE/dart/scripts/package/pack.ts" --version "$VERSION"
      - run: node "$GITHUB_WORKSPACE/dart/scripts/package/validate-package.ts"
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: ts/artifacts
          merge-multiple: true

      - run: node "$GITHUB_WORKSPACE/scripts/release/delete-draft-release.ts" --tag "v$VERSION"
      - run: node "$GITHUB_WORKSPACE/scripts/release/create-draft-release.ts" --tag "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
